- name: Gate K3s host changes on the observed version transition
  ansible.builtin.include_role:
    name: cluster_version

- name: Require running K3s identity before a version-changing installer
  ansible.builtin.include_role:
    name: cluster_health
  vars:
    certweaver_cluster_health_phase: pre-upgrade
  when:
    - certweaver_cluster_version_current | length > 0
    - certweaver_cluster_version_install_needed | bool

- name: Verify K3s token file
  ansible.builtin.assert:
    that:
      - certweaver_rke2_token_file is not none
      - lookup('ansible.builtin.file', certweaver_rke2_token_file, errors='ignore') | trim | length >= 16
  no_log: true

- name: Verify K3s installer checksum
  ansible.builtin.assert:
    that:
      - certweaver_k3s_install_script_checksum is match('^sha256:[a-fA-F0-9]{64}$')
    fail_msg: >-
      K3s installation requires an approved SHA-256 checksum for the installer script.

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Download K3s installer
  ansible.builtin.get_url:
    url: "{{ certweaver_k3s_install_script_url }}"
    dest: /root/install-k3s.sh
    owner: root
    group: root
    mode: "0700"
    checksum: "{{ certweaver_k3s_install_script_checksum }}"

- name: Render K3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s
  no_log: true
  diff: false

- name: Install or upgrade pinned K3s server
  ansible.builtin.command: /root/install-k3s.sh
  environment:
    INSTALL_K3S_VERSION: "{{ certweaver_k3s_version }}"
    INSTALL_K3S_EXEC: server
  when: certweaver_cluster_version_install_needed | bool
  changed_when: true
  notify: Restart K3s

- name: Enable and start K3s
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending K3s restart before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Wait for local K3s API
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    delay: 3
    timeout: 600

- name: Gate K3s reconciliation on authenticated API and exact node readiness
  ansible.builtin.include_role:
    name: cluster_health
  vars:
    certweaver_cluster_health_phase: post-reconcile
