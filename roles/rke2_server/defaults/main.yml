certweaver_rke2_install_script_url: https://get.rke2.io
certweaver_rke2_install_script_checksum: ""
certweaver_rke2_cni: canal
certweaver_rke2_disable_components:
  - rke2-ingress-nginx
certweaver_rke2_write_kubeconfig_mode: "0640"
certweaver_rke2_secrets_encryption: true
certweaver_rke2_audit_enabled: true
certweaver_rke2_etcd_snapshot_enabled: true
certweaver_rke2_etcd_snapshot_schedule: "0 */6 * * *"
certweaver_rke2_etcd_snapshot_retention: 28
certweaver_rke2_etcd_s3_enabled: false
certweaver_rke2_etcd_s3_secret_name: certweaver-etcd-s3
certweaver_rke2_etcd_s3_config_file: ""
certweaver_rke2_profile: ""

certweaver_rke2_protect_kernel_defaults: false
certweaver_rke2_selinux: true
