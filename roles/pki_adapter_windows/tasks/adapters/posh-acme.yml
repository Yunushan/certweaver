- name: Require a pinned Posh-ACME module version
  ansible.builtin.assert:
    that:
      - certweaver_posh_acme_version is match('^[0-9]+([.][0-9]+){1,3}$')
    fail_msg: "Set a reviewed numeric spec.adapters.versions.posh_acme."

- name: Install the pinned Posh-ACME module from PowerShell Gallery
  community.windows.win_psmodule:
    name: Posh-ACME
    repository: "{{ certweaver_posh_acme_repository }}"
    required_version: "{{ certweaver_posh_acme_version }}"
    state: present
    accept_license: true

- name: Verify Posh-ACME module
  ansible.windows.win_powershell:
    script: |
      param([string]$ExpectedVersion)
      $module = Get-Module -ListAvailable Posh-ACME |
        Where-Object { $_.Version.ToString() -eq $ExpectedVersion } |
        Select-Object -First 1
      if (-not $module) { throw "The pinned Posh-ACME version is not installed" }
      $Ansible.Result = @{ Version = $module.Version.ToString() }
      $Ansible.Changed = $false
    parameters:
      ExpectedVersion: "{{ certweaver_posh_acme_version }}"
