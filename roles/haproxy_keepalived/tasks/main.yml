- name: Verify load-balancer prerequisites
  ansible.builtin.assert:
    that:
      - certweaver_vip | length > 0
      - certweaver_vip_interface | length > 0
      - certweaver_keepalived_auth_file is not none
      - lookup('ansible.builtin.file', certweaver_keepalived_auth_file, errors='ignore') | length >= 8
    fail_msg: "VIP, interface, and an 8+ character Keepalived auth file are required."
  no_log: true

- name: Install HAProxy and Keepalived
  ansible.builtin.dnf:
    name:
      - haproxy
      - keepalived
    state: present

- name: Read the enforcing-SELinux HAProxy network policy
  ansible.builtin.command: getsebool haproxy_connect_any
  register: certweaver_haproxy_selinux_network_policy
  changed_when: false
  check_mode: false
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Require an operator-approved SELinux policy before starting HAProxy
  ansible.builtin.assert:
    that:
      - certweaver_haproxy_selinux_network_policy.stdout | trim == 'haproxy_connect_any --> on'
    fail_msg: >-
      Enforcing SELinux requires an approved HAProxy network policy for these
      frontend/backend ports. Have the host security owner review the documented
      prerequisite in docs/operations.md. CertWeaver does not change SELinux
      booleans or disable enforcement.
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Install HAProxy health check for Keepalived
  ansible.builtin.copy:
    src: check-haproxy.sh
    dest: /usr/local/sbin/check-certweaver-haproxy
    owner: root
    group: root
    mode: "0755"

- name: Render HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0640"
    validate: /usr/sbin/haproxy -c -f %s
  notify: Restart HAProxy

- name: Render Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart Keepalived
  no_log: true
  diff: false

- name: Enable HAProxy
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started

- name: Enable Keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started
