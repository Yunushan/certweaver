- name: Resolve this host's SPIRE components and reviewed configuration
  ansible.builtin.set_fact:
    certweaver_spire_options: |-
      {{ certweaver_adapter_options.get('spire', {}) | combine(
         certweaver_adapter_options.get('spire', {}).get('hosts', {}).get(inventory_hostname, {})) }}
- name: Validate native SPIRE inputs before installation
  ansible.builtin.assert:
    that:
      - certweaver_spire_options.components | default([]) | length > 0
      - certweaver_spire_options.components | difference(['server', 'agent']) | length == 0
    fail_msg: SPIRE requires at least one server/agent component.
- name: Require reviewed configuration for each selected SPIRE component
  ansible.builtin.assert:
    that:
      - certweaver_spire_options.get(component ~ 'ConfigFile', '') is match('^/[^\n]+$')
    fail_msg: SPIRE requires server/agent components and reviewed absolute configuration file paths.
  loop: '{{ certweaver_spire_options.components | default([]) }}'
  loop_control:
    loop_var: component
- name: Require pinned SPIRE binary release
  ansible.builtin.include_tasks: _require_version.yml
  vars:
    certweaver_required_adapter: spire
    certweaver_require_binary_version: true
    certweaver_required_version: '{{ certweaver_adapter_versions.spire }}'
- name: Acquire verified SPIRE Linux distribution
  ansible.builtin.include_tasks: _download_verified.yml
  vars:
    certweaver_download_name: spire
    certweaver_download_url: |-
      {{ 'https://github.com/spiffe/spire/releases/download/v' ~
         certweaver_adapter_versions.spire ~ '/spire-' ~ certweaver_adapter_versions.spire ~
         '-linux-' ~ certweaver_adapter_arch ~ '-musl.tar.gz' }}
- name: Create SPIRE release extraction directory
  ansible.builtin.file:
    path: '{{ certweaver_adapter_payload_directory }}/extracted'
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: not ansible_check_mode
- name: Extract the verified SPIRE distribution
  ansible.builtin.unarchive:
    src: '{{ certweaver_adapter_payload_path }}'
    dest: '{{ certweaver_adapter_payload_directory }}/extracted'
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: root
    group: root
  when: not ansible_check_mode
- name: Install selected SPIRE executables
  ansible.builtin.copy:
    src: '{{ certweaver_adapter_payload_directory }}/extracted/bin/spire-{{ component }}'
    dest: /usr/local/bin/spire-{{ component }}
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  loop: '{{ certweaver_spire_options.components }}'
  loop_control:
    loop_var: component
  register: certweaver_spire_binaries
  when: not ansible_check_mode
- name: Create SPIRE server service identity
  ansible.builtin.user:
    name: spire
    system: true
    create_home: false
    shell: /sbin/nologin
- name: Stage SPIRE trust and credential inputs
  ansible.builtin.include_tasks: _stage_files.yml
  vars:
    certweaver_file_adapter: spire
    certweaver_file_group: spire
- name: Create SPIRE configuration directory
  ansible.builtin.file:
    path: /etc/spire
    state: directory
    owner: root
    group: spire
    mode: '0750'
- name: Install reviewed SPIRE configuration
  ansible.builtin.copy:
    src: '{{ certweaver_spire_options[component ~ ''ConfigFile''] }}'
    dest: /etc/spire/{{ component }}.conf
    owner: root
    group: '{{ ''spire'' if component == ''server'' else ''root'' }}'
    mode: '0640'
  loop: '{{ certweaver_spire_options.components }}'
  loop_control:
    loop_var: component
  register: certweaver_spire_configuration
  no_log: true
- name: Render selected SPIRE services
  ansible.builtin.template:
    src: spire.service.j2
    dest: /etc/systemd/system/certweaver-spire-{{ component }}.service
    owner: root
    group: root
    mode: '0644'
  loop: '{{ certweaver_spire_options.components }}'
  loop_control:
    loop_var: component
  register: certweaver_spire_units
- name: Reconcile explicitly activated SPIRE services
  ansible.builtin.include_tasks: _activate_service.yml
  vars:
    certweaver_service_name: certweaver-spire-{{ component }}.service
    certweaver_service_witness_marker: /etc/spire/activated-{{ component }}.json
    certweaver_service_witness_paths: >-
      {{ ['/usr/local/bin/spire-' ~ component, '/etc/spire/' ~ component ~ '.conf',
          '/etc/systemd/system/certweaver-spire-' ~ component ~ '.service'] +
         (certweaver_spire_options.get('files', []) | map(attribute='name') |
          map('regex_replace', '^', '/etc/certweaver/spire/') | list) }}
  loop: '{{ certweaver_spire_options.components }}'
  loop_control:
    loop_var: component
