- name: Require pinned CFSSL version
  ansible.builtin.include_tasks: ../_require_version.yml
  vars:
    certweaver_required_adapter: cfssl
    certweaver_require_binary_version: true
    certweaver_required_version: "{{ certweaver_adapter_versions.cfssl }}"

- name: Download CFSSL binaries
  ansible.builtin.include_tasks: ../_install_verified_binary.yml
  vars:
    certweaver_download_name: "{{ item }}"
    certweaver_download_url: >-
      {{ 'https://github.com/cloudflare/cfssl/releases/download/v' ~
         certweaver_adapter_versions.cfssl ~ '/' ~ item ~ '_' ~
         certweaver_adapter_versions.cfssl ~ '_linux_' ~
         certweaver_adapter_arch }}
  loop:
    - cfssl
    - cfssljson
    - cfssl-bundle
