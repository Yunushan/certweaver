- name: Verify trust-manager is enabled as a core add-on
  ansible.builtin.assert:
    that:
      - certweaver_mode in ['rke2-ha', 'k3s-ha', 'existing-kubernetes']
      - certweaver_addons.trustManager.enabled | default(false) | bool
    fail_msg: "Enable spec.addons.trustManager; the cluster add-on role owns installation."

- name: Query trust-manager deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ certweaver_kubeconfig_path | default('/root/.kube/config') }}
    -n {{ certweaver_addons.trustManager.dedicatedNamespace | default('cert-manager-trust') }}
    get deployment trust-manager
  changed_when: false
