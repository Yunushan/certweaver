- name: Enforce Lemur legacy guard
  ansible.builtin.assert:
    that:
      - "'lemur' in certweaver_allow_risky_adapters"
    fail_msg: "Lemur is marked legacy/maintenance-risk and requires explicit acknowledgement."

- name: Require pinned Lemur Git ref
  ansible.builtin.include_tasks: ../_require_version.yml
  vars:
    certweaver_required_adapter: lemur
    certweaver_required_version: "{{ certweaver_adapter_versions.lemur_ref }}"

- name: Install Lemur source prerequisites
  ansible.builtin.dnf:
    name: [git, python3, python3-pip, postgresql]
    state: present

- name: Clone pinned Lemur source
  ansible.builtin.git:
    repo: https://github.com/Netflix/lemur.git
    dest: "{{ certweaver_adapter_root }}/lemur"
    version: "{{ certweaver_adapter_versions.lemur_ref }}"
    update: false

- name: Explain required legacy integration work
  ansible.builtin.debug:
    msg: >-
      Lemur source is pinned and staged. Configure its database, identity provider, CA plugins,
      secrets, migration, and process supervision only after a maintenance/security review.
