- name: Enforce Lemur legacy guard
  ansible.builtin.assert:
    that:
      - '''lemur'' in certweaver_allow_risky_adapters'
    fail_msg: Lemur is marked legacy/maintenance-risk and requires explicit acknowledgement.
- name: Require immutable lemur commit before prerequisites
  ansible.builtin.include_tasks: ../_require_version.yml
  vars:
    certweaver_required_adapter: lemur
    certweaver_require_git_commit: true
    certweaver_required_version: '{{ certweaver_adapter_versions.lemur_ref }}'
- name: Install Lemur source prerequisites
  ansible.builtin.dnf:
    name:
      - git
      - python3.12
      - python3.12-pip
      - nodejs
      - npm
    state: present
- name: Acquire verified lemur Git source
  ansible.builtin.include_tasks: ../_checkout_verified_git.yml
  vars:
    certweaver_git_name: lemur
    certweaver_git_repository: https://github.com/Netflix/lemur.git
    certweaver_git_commit: '{{ certweaver_adapter_versions.lemur_ref }}'
- name: Build and install the reviewed Lemur application
  ansible.builtin.include_tasks: ../_lemur_native.yml
  when:
    - not ansible_check_mode
    - certweaver_adapter_source_verified | bool
