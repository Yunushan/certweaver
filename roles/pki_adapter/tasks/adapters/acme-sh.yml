- name: Require immutable acme-sh commit before prerequisites
  ansible.builtin.include_tasks: ../_require_version.yml
  vars:
    certweaver_required_adapter: acme-sh
    certweaver_require_git_commit: true
    certweaver_required_version: "{{ certweaver_adapter_versions.acme_sh_ref }}"

- name: Install acme.sh dependencies
  ansible.builtin.dnf:
    name: [git, openssl, curl, socat, cronie]
    state: present

- name: Acquire verified acme-sh Git source
  ansible.builtin.include_tasks: ../_checkout_verified_git.yml
  vars:
    certweaver_git_name: acme-sh
    certweaver_git_repository: https://github.com/acmesh-official/acme.sh.git
    certweaver_git_commit: "{{ certweaver_adapter_versions.acme_sh_ref }}"

- name: Reconcile acme.sh installation from verified source
  ansible.builtin.include_tasks: ../_install_acme_sh.yml
