- name: Verify cert-manager CSI Driver add-on is enabled
  ansible.builtin.assert:
    that:
      - certweaver_mode in ['rke2-ha', 'k3s-ha', 'existing-kubernetes']
      - certweaver_addons.csiDriver.enabled | default(false) | bool
    fail_msg: "Enable spec.addons.csiDriver; the cluster add-on role owns installation."

- name: Query CSI Driver daemon set
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ certweaver_kubeconfig_path | default('/root/.kube/config') }}
    -n cert-manager get daemonset cert-manager-csi-driver
  changed_when: false
