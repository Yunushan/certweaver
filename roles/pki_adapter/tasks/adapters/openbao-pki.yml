- name: Resolve OpenBao install mode
  ansible.builtin.set_fact:
    certweaver_openbao_mode: >-
      {{ certweaver_adapter_options.get('openbao-pki', {}).get('installMode',
         'kubernetes' if certweaver_mode in ['rke2-ha', 'k3s-ha', 'existing-kubernetes'] else 'docker') }}

- name: Require an implemented OpenBao install mode
  ansible.builtin.assert:
    that:
      - certweaver_openbao_mode in ['docker', 'kubernetes']
    fail_msg: "OpenBao installMode must be docker or kubernetes."

- name: Install OpenBao Helm release
  when: certweaver_openbao_mode == 'kubernetes'
  block:
    - name: Acquire verified openbao chart
      ansible.builtin.include_role:
        name: verified_chart
      vars:
        certweaver_chart_key: "openbao_chart"
        certweaver_chart_name: "openbao"
        certweaver_chart_reference: "openbao"
        certweaver_chart_repository: "https://openbao.github.io/openbao-helm"
        certweaver_chart_version: "{{ certweaver_adapter_versions.openbao_chart }}"
        certweaver_chart_checksum: "{{ certweaver_adapter_checksums.get('openbao_chart', '') }}"

    - name: Install OpenBao
      ansible.builtin.command:
        argv:
          - "{{ certweaver_chart_helm_executable | default('/usr/local/bin/helm') }}"
          - upgrade
          - --install
          - openbao
          - "{{ certweaver_chart_archive_path }}"
          - --namespace
          - openbao
          - --create-namespace
          - --values
          - "{{ certweaver_adapter_options.get('openbao-pki', {}).get('valuesFile', '/etc/certweaver/openbao-values.yaml') }}"
          - --wait
          - --timeout
          - 15m
      environment:
        KUBECONFIG: "{{ certweaver_kubeconfig_path | default('/root/.kube/config') }}"
      register: certweaver_openbao_helm
      changed_when: "'has been upgraded' in certweaver_openbao_helm.stdout or 'has been installed' in certweaver_openbao_helm.stdout"
      when:
        - not ansible_check_mode
        - certweaver_chart_verified | default(false) | bool

- name: Prepare OpenBao Podman Quadlet
  when: certweaver_openbao_mode == 'docker'
  block:
    - name: Require pinned OpenBao image digest
      ansible.builtin.include_tasks: ../_require_version.yml
      vars:
        certweaver_required_adapter: openbao-image
        certweaver_require_image_digest: true
        certweaver_required_version: "{{ certweaver_adapter_versions.openbao_image }}"

    - name: Ensure Podman exists
      ansible.builtin.include_tasks: ../_ensure_podman.yml

    - name: Create OpenBao directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/openbao
        - /var/lib/openbao
        - /var/log/openbao

    - name: Render OpenBao configuration
      ansible.builtin.template:
        src: openbao.hcl.j2
        dest: /etc/openbao/openbao.hcl
        owner: root
        group: root
        mode: "0600"
      register: certweaver_openbao_configuration

    - name: Render OpenBao Quadlet
      ansible.builtin.template:
        src: openbao.container.j2
        dest: /etc/containers/systemd/certweaver-openbao.container
        owner: root
        group: root
        mode: "0600"
      register: certweaver_openbao_quadlet
      notify: Reload adapter systemd

- name: Activate OpenBao Quadlet when explicitly requested
  when:
    - certweaver_openbao_mode == 'docker'
    - certweaver_adapter_start_services | bool
  block:
    - name: Reload systemd after OpenBao Quadlet creation
      ansible.builtin.meta: flush_handlers

    - name: Enable and start OpenBao container service
      ansible.builtin.systemd:
        name: certweaver-openbao.service
        enabled: true
        state: >-
          {{ 'restarted' if certweaver_openbao_quadlet.changed or
             certweaver_openbao_configuration.changed else 'started' }}
