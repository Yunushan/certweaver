- name: Require pinned lego version
  ansible.builtin.include_tasks: ../_require_version.yml
  vars:
    certweaver_required_adapter: lego
    certweaver_required_version: "{{ certweaver_adapter_versions.lego }}"

- name: Download and install lego
  ansible.builtin.unarchive:
    src: >-
      {{ 'https://github.com/go-acme/lego/releases/download/v' ~
         certweaver_adapter_versions.lego ~ '/lego_v' ~
         certweaver_adapter_versions.lego ~ '_linux_' ~
         certweaver_adapter_arch ~ '.tar.gz' }}
    dest: /usr/local/bin
    remote_src: true
    include: [lego]
    owner: root
    group: root
    mode: "0755"
