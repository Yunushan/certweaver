- name: Resolve step-ca install mode
  ansible.builtin.set_fact:
    certweaver_step_ca_mode: >-
      {{ certweaver_adapter_options.get('step-ca', {}).get('installMode',
         'kubernetes' if certweaver_mode in ['rke2-ha', 'k3s-ha', 'existing-kubernetes'] else
         ('docker' if certweaver_mode == 'docker' else 'standalone')) }}

- name: Require an implemented step-ca install mode
  ansible.builtin.assert:
    that:
      - certweaver_step_ca_mode in ['standalone', 'docker', 'kubernetes']
    fail_msg: "step-ca installMode must be standalone, docker or kubernetes."

- name: Install step-ca with the official Helm chart
  when: certweaver_step_ca_mode == 'kubernetes'
  block:
    - name: Ensure Helm exists
      ansible.builtin.include_tasks: ../_ensure_helm.yml

    - name: Acquire verified step-certificates chart
      ansible.builtin.include_role:
        name: verified_chart
      vars:
        certweaver_chart_key: "step_ca_chart"
        certweaver_chart_name: "step-certificates"
        certweaver_chart_reference: "step-certificates"
        certweaver_chart_repository: "https://smallstep.github.io/helm-charts"
        certweaver_chart_version: "{{ certweaver_adapter_versions.step_ca_chart }}"
        certweaver_chart_checksum: "{{ certweaver_adapter_checksums.get('step_ca_chart', '') }}"

    - name: Install step-certificates chart
      ansible.builtin.command:
        argv:
          - "{{ certweaver_chart_helm_executable | default('/usr/local/bin/helm') }}"
          - upgrade
          - --install
          - step-ca
          - "{{ certweaver_chart_archive_path }}"
          - --namespace
          - step-ca
          - --create-namespace
          - --values
          - "{{ certweaver_adapter_options.get('step-ca', {}).get('valuesFile', '/etc/certweaver/step-ca-values.yaml') }}"
          - --wait
          - --timeout
          - 15m
      environment:
        KUBECONFIG: "{{ certweaver_kubeconfig_path | default('/root/.kube/config') }}"
      register: certweaver_step_ca_helm
      changed_when: >-
        'has been upgraded' in certweaver_step_ca_helm.stdout or
        'has been installed' in certweaver_step_ca_helm.stdout
      when:
        - not ansible_check_mode
        - certweaver_chart_verified | default(false) | bool

- name: Install standalone/container step-ca binary and service assets
  when: certweaver_step_ca_mode in ['standalone', 'docker']
  block:
    - name: Require pinned standalone step-ca version
      ansible.builtin.include_tasks: ../_require_version.yml
      vars:
        certweaver_required_adapter: step-ca
        certweaver_require_binary_version: true
        certweaver_required_version: "{{ certweaver_adapter_versions.step_ca }}"
      when: certweaver_step_ca_mode == 'standalone'

    - name: Require pinned step-ca container image digest
      ansible.builtin.include_tasks: ../_require_version.yml
      vars:
        certweaver_required_adapter: step-ca-image
        certweaver_require_image_digest: true
        certweaver_required_version: "{{ certweaver_adapter_versions.step_ca_image }}"
      when: certweaver_step_ca_mode == 'docker'

    - name: Install Podman for step-ca container mode
      ansible.builtin.include_tasks: ../_ensure_podman.yml
      when: certweaver_step_ca_mode == 'docker'

    - name: Create step-ca persistent directory
      ansible.builtin.file:
        path: /var/lib/step-ca
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Render step-ca Quadlet
      ansible.builtin.template:
        src: step-ca.container.j2
        dest: /etc/containers/systemd/certweaver-step-ca.container
        owner: root
        group: root
        mode: "0600"
      when: certweaver_step_ca_mode == 'docker'
      register: certweaver_step_ca_quadlet
      notify: Reload adapter systemd

    - name: Acquire verified step-ca binary archive
      ansible.builtin.include_tasks: ../_download_verified.yml
      vars:
        certweaver_download_name: step_ca
        certweaver_download_url: >-
          {{ 'https://github.com/smallstep/certificates/releases/download/v' ~
             certweaver_adapter_versions.step_ca ~ '/step-ca_linux_' ~
             certweaver_adapter_versions.step_ca ~ '_' ~
             certweaver_adapter_arch ~ '.tar.gz' }}
      when: certweaver_step_ca_mode == 'standalone'

    - name: Create private step-ca extraction directory
      ansible.builtin.file:
        path: "{{ certweaver_adapter_payload_directory }}/extracted"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when:
        - certweaver_step_ca_mode == 'standalone'
        - not ansible_check_mode

    - name: Extract verified step-ca archive
      ansible.builtin.unarchive:
        src: "{{ certweaver_adapter_payload_path }}"
        dest: "{{ certweaver_adapter_payload_directory }}/extracted"
        remote_src: true
        owner: root
        group: root
      when:
        - certweaver_step_ca_mode == 'standalone'
        - not ansible_check_mode

    - name: Install step-ca binary
      ansible.builtin.copy:
        src: >-
          {{ certweaver_adapter_payload_directory ~ '/extracted/step-ca_linux_' ~
             certweaver_adapter_versions.step_ca ~ '_' ~ certweaver_adapter_arch ~ '/bin/step-ca' }}
        dest: /usr/local/bin/step-ca
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when:
        - certweaver_step_ca_mode == 'standalone'
        - not ansible_check_mode

- name: Activate step-ca Quadlet when explicitly requested
  when:
    - certweaver_step_ca_mode == 'docker'
    - certweaver_adapter_start_services | bool
  block:
    - name: Reload systemd after step-ca Quadlet creation
      ansible.builtin.meta: flush_handlers

    - name: Enable and start step-ca container service
      ansible.builtin.systemd:
        name: certweaver-step-ca.service
        enabled: true
        state: "{{ 'restarted' if certweaver_step_ca_quadlet.changed else 'started' }}"
