- name: Require pinned dehydrated Git ref
  ansible.builtin.include_tasks: ../_require_version.yml
  vars:
    certweaver_required_adapter: dehydrated
    certweaver_required_version: "{{ certweaver_adapter_versions.dehydrated_ref }}"

- name: Install dehydrated dependencies
  ansible.builtin.dnf:
    name: [git, openssl, curl]
    state: present

- name: Clone pinned dehydrated source
  ansible.builtin.git:
    repo: https://github.com/dehydrated-io/dehydrated.git
    dest: "{{ certweaver_adapter_root }}/dehydrated"
    version: "{{ certweaver_adapter_versions.dehydrated_ref }}"
    update: false

- name: Link dehydrated CLI
  ansible.builtin.file:
    src: "{{ certweaver_adapter_root }}/dehydrated/dehydrated"
    dest: /usr/local/bin/dehydrated
    state: link
