- name: Validate optional private controller credential export before add-on changes
  ansible.builtin.include_tasks: _kubeconfig_preflight.yml
  when: certweaver_fetch_kubeconfig | bool

- name: Validate production snapshot input before add-on changes
  ansible.builtin.include_role:
    name: snapshot_config
  tags: [always]

- name: Resolve cluster CLI paths
  ansible.builtin.set_fact:
    certweaver_cluster_kubeconfig_source: >-
      {{ certweaver_kubeconfig_source_rke2 if certweaver_mode == 'rke2-ha'
         else (certweaver_kubeconfig_source_k3s if certweaver_mode == 'k3s-ha'
         else certweaver_existing_kubeconfig_source) }}
    certweaver_helm_arch: "{{ certweaver_helm_arch_map.get(ansible_architecture, 'amd64') }}"

- name: Resolve Helm checksum for the target architecture
  ansible.builtin.set_fact:
    certweaver_helm_checksum_resolved: >-
      {{ certweaver_helm_checksums.get(certweaver_helm_arch, certweaver_helm_checksum) }}

- name: Verify supported Helm architecture and archive checksum
  ansible.builtin.assert:
    that:
      - ansible_architecture in certweaver_helm_arch_map
      - certweaver_helm_checksum_resolved is match('^sha256:[a-fA-F0-9]{64}$')
    fail_msg: "Helm installation requires a supported architecture and approved SHA-256 checksum."

- name: Create a private version-specific Helm staging directory
  ansible.builtin.file:
    path: "/var/cache/certweaver/helm/{{ certweaver_helm_version }}-{{ certweaver_helm_arch }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create operator Kubernetes directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /root/.kube
    - /etc/certweaver/kubernetes

- name: Download pinned Helm archive
  ansible.builtin.get_url:
    url: >-
      https://get.helm.sh/helm-{{ certweaver_helm_version }}-linux-{{ certweaver_helm_arch }}.tar.gz
    dest: "/var/cache/certweaver/helm/{{ certweaver_helm_version }}-{{ certweaver_helm_arch }}/helm.tar.gz"
    owner: root
    group: root
    mode: "0600"
    checksum: "{{ certweaver_helm_checksum_resolved }}"

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "/var/cache/certweaver/helm/{{ certweaver_helm_version }}-{{ certweaver_helm_arch }}/helm.tar.gz"
    dest: "/var/cache/certweaver/helm/{{ certweaver_helm_version }}-{{ certweaver_helm_arch }}"
    remote_src: true

- name: Place Helm binary
  ansible.builtin.copy:
    src: "/var/cache/certweaver/helm/{{ certweaver_helm_version }}-{{ certweaver_helm_arch }}/linux-{{ certweaver_helm_arch }}/helm"
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Link kubectl for RKE2
  ansible.builtin.file:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: /usr/local/bin/kubectl
    state: link
  when: certweaver_mode == 'rke2-ha'

- name: Link kubectl for K3s
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
  when: certweaver_mode == 'k3s-ha'

- name: Verify kubectl exists for an existing cluster
  ansible.builtin.command: kubectl version --client=true
  changed_when: false
  when: certweaver_mode == 'existing-kubernetes'

- name: Copy cluster kubeconfig into the operator path
  ansible.builtin.copy:
    src: "{{ certweaver_cluster_kubeconfig_source }}"
    dest: "{{ certweaver_kubeconfig_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - certweaver_mode == 'existing-kubernetes'
    - certweaver_cluster_kubeconfig_source != certweaver_kubeconfig_path
  no_log: true
  diff: false

- name: Protect an in-place existing-cluster kubeconfig
  ansible.builtin.file:
    path: "{{ certweaver_kubeconfig_path }}"
    owner: root
    group: root
    mode: "0600"
    state: file
  when:
    - certweaver_mode == 'existing-kubernetes'
    - certweaver_cluster_kubeconfig_source == certweaver_kubeconfig_path

- name: Configure the selected operator cluster for the floating VIP
  ansible.builtin.include_tasks: _configure_operator_endpoint.yml
  when: certweaver_mode in ['rke2-ha', 'k3s-ha']

- name: Copy Kubernetes add-on assets
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/certweaver/kubernetes/
    owner: root
    group: root
    mode: preserve
  loop:
    - "{{ role_path }}/../../kubernetes/cert-manager"
    - "{{ role_path }}/../../kubernetes/approver-policy"
    - "{{ role_path }}/../../kubernetes/trust-manager"
    - "{{ role_path }}/../../kubernetes/csi-driver"
    - "{{ role_path }}/../../kubernetes/traefik"
    - "{{ role_path }}/../../kubernetes/issuers"
    - "{{ role_path }}/../../kubernetes/monitoring"

- name: Reconcile RKE2 S3 snapshot secret
  no_log: true
  diff: false
  when:
    - certweaver_mode == 'rke2-ha'
    - certweaver_rke2_etcd_s3_enabled | bool
    - not ansible_check_mode
  block:
    - name: Clear snapshot staging identity before validation
      ansible.builtin.set_fact:
        certweaver_snapshot_stage: {}

    - name: Revalidate snapshot input immediately before private transfer
      ansible.builtin.include_role:
        name: snapshot_config
      tags: [always]

    - name: Allocate invocation-private snapshot staging
      ansible.builtin.tempfile:
        state: directory
        path: /run
        prefix: certweaver-etcd-s3-
      register: certweaver_snapshot_stage
      changed_when: false

    - name: Protect invocation-private snapshot staging
      ansible.builtin.file:
        path: "{{ certweaver_snapshot_stage.path }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      changed_when: false

    - name: Verify snapshot comparison utility is available
      ansible.builtin.command: diff --version
      changed_when: false

    - name: Verify controller S3 snapshot secret file
      ansible.builtin.assert:
        that:
          - certweaver_rke2_etcd_s3_config_file is not none
          - lookup('ansible.builtin.file', certweaver_rke2_etcd_s3_config_file, errors='ignore') | trim | length > 0
        fail_msg: >-
          Create the RKE2 etcd S3 configuration secret file on the Ansible controller.

    - name: Stage RKE2 S3 snapshot secret configuration
      ansible.builtin.copy:
        src: "{{ certweaver_rke2_etcd_s3_config_file }}"
        dest: "{{ certweaver_snapshot_stage.path }}/snapshot.env"
        owner: root
        group: root
        mode: "0600"
        checksum: >-
          {{ certweaver_snapshot_policy.sha1
             if certweaver_environment | default('production') == 'production' else omit }}
      changed_when: false

    - name: Inspect transferred private snapshot input identity
      ansible.builtin.stat:
        path: "{{ certweaver_snapshot_stage.path }}/snapshot.env"
        get_checksum: true
        checksum_algorithm: sha256
        get_mime: false
        get_attributes: false
      register: certweaver_snapshot_staged
      when: certweaver_environment | default('production') == 'production'

    - name: Require exactly the validated snapshot bytes before secret rendering
      ansible.builtin.assert:
        that:
          - certweaver_snapshot_staged.stat.checksum == certweaver_snapshot_policy.sha256
          - certweaver_snapshot_staged.stat.size == certweaver_snapshot_policy.bytes
        fail_msg: Transferred snapshot input differs from the validated controller file.
      when: certweaver_environment | default('production') == 'production'

    - name: Render RKE2 S3 snapshot Kubernetes Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ certweaver_kubeconfig_path }}"
          - -n
          - kube-system
          - create
          - secret
          - generic
          - "{{ certweaver_rke2_etcd_s3_secret_name }}"
          - --type=etcd.k3s.cattle.io/s3-config-secret
          - "--from-env-file={{ certweaver_snapshot_stage.path }}/snapshot.env"
          - --dry-run=client
          - -o
          - yaml
      register: certweaver_rke2_etcd_s3_secret
      changed_when: false

    - name: Write rendered RKE2 S3 snapshot Kubernetes Secret
      ansible.builtin.copy:
        content: "{{ certweaver_rke2_etcd_s3_secret.stdout }}"
        dest: "{{ certweaver_snapshot_stage.path }}/secret.yaml"
        owner: root
        group: root
        mode: "0600"
      changed_when: false

    - name: Compare RKE2 S3 snapshot Secret with server-side desired state
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ certweaver_kubeconfig_path }}"
          - "--cache-dir={{ certweaver_snapshot_stage.path }}/cache"
          - --request-timeout=30s
          - diff
          - --server-side
          - --field-manager=certweaver
          - --show-secrets=false
          - -f
          - "{{ certweaver_snapshot_stage.path }}/secret.yaml"
      environment:
        KUBECTL_EXTERNAL_DIFF: ""
        TMPDIR: "{{ certweaver_snapshot_stage.path }}"
      register: certweaver_rke2_etcd_s3_diff
      changed_when: false
      failed_when: certweaver_rke2_etcd_s3_diff.rc not in [0, 1]

    - name: Apply RKE2 S3 snapshot Kubernetes Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ certweaver_kubeconfig_path }}"
          - "--cache-dir={{ certweaver_snapshot_stage.path }}/cache"
          - --request-timeout=30s
          - apply
          - --server-side
          - --field-manager=certweaver
          - -f
          - "{{ certweaver_snapshot_stage.path }}/secret.yaml"
      register: certweaver_rke2_etcd_s3_apply
      when: certweaver_rke2_etcd_s3_diff.rc == 1
      changed_when: true
  always:
    - name: Remove staged RKE2 S3 snapshot secret material
      ansible.builtin.file:
        path: "{{ certweaver_snapshot_stage.path }}"
        state: absent
      when: certweaver_snapshot_stage.path is defined
      changed_when: false

- name: Acquire verified cert-manager chart
  ansible.builtin.include_role:
    name: verified_chart
  vars:
    certweaver_chart_key: "certManager"
    certweaver_chart_name: "cert-manager"
    certweaver_chart_reference: "oci://quay.io/jetstack/charts/cert-manager"
    certweaver_chart_repository: ""
    certweaver_chart_version: "{{ certweaver_cert_manager_version }}"
    certweaver_chart_checksum: "{{ certweaver_chart_checksums.get('certManager', '') }}"
  when: certweaver_addons.certManager.enabled | default(false) | bool

- name: Install cert-manager
  ansible.builtin.command:
    argv:
      - "{{ certweaver_chart_helm_executable | default('/usr/local/bin/helm') }}"
      - upgrade
      - --install
      - cert-manager
      - "{{ certweaver_chart_archive_path }}"
      - --namespace
      - cert-manager
      - --create-namespace
      - --values
      - /etc/certweaver/kubernetes/cert-manager/values.yaml
      - --set
      - "disableAutoApproval={{ certweaver_addons.certManager.disableAutoApproval | default(true) | bool | lower }}"
      - --set
      - "networkPolicy.enabled={{ certweaver_addons.certManager.networkPolicy | default(true) | bool | lower }}"
      - --set
      - "prometheus.enabled={{ certweaver_addons.certManager.prometheus | default(true) | bool | lower }}"
      - --wait
      - --timeout
      - 10m
  environment:
    KUBECONFIG: "{{ certweaver_kubeconfig_path }}"
  register: certweaver_cert_manager_helm
  changed_when: >-
    'has been upgraded' in certweaver_cert_manager_helm.stdout or
    'has been installed' in certweaver_cert_manager_helm.stdout
  when:
    - certweaver_addons.certManager.enabled | default(false) | bool
    - not ansible_check_mode
    - certweaver_chart_verified | default(false) | bool

- name: Wait for cert-manager webhook readiness
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ certweaver_kubeconfig_path }}"
      - wait
      - --for=condition=Available
      - deployment/cert-manager-webhook
      - --namespace=cert-manager
      - --timeout=300s
  changed_when: false
  when: certweaver_addons.certManager.enabled | default(false) | bool

- name: Acquire verified cert-manager-approver-policy chart
  ansible.builtin.include_role:
    name: verified_chart
  vars:
    certweaver_chart_key: "approverPolicy"
    certweaver_chart_name: "cert-manager-approver-policy"
    certweaver_chart_reference: "oci://quay.io/jetstack/charts/cert-manager-approver-policy"
    certweaver_chart_repository: ""
    certweaver_chart_version: "{{ certweaver_approver_policy_version }}"
    certweaver_chart_checksum: "{{ certweaver_chart_checksums.get('approverPolicy', '') }}"
  when: certweaver_addons.approverPolicy.enabled | default(false) | bool

- name: Install approver-policy
  ansible.builtin.command:
    argv:
      - "{{ certweaver_chart_helm_executable | default('/usr/local/bin/helm') }}"
      - upgrade
      - --install
      - cert-manager-approver-policy
      - "{{ certweaver_chart_archive_path }}"
      - --namespace
      - cert-manager
      - --values
      - /etc/certweaver/kubernetes/approver-policy/values.yaml
      - --wait
      - --timeout
      - 10m
  environment:
    KUBECONFIG: "{{ certweaver_kubeconfig_path }}"
  register: certweaver_approver_policy_helm
  changed_when: >-
    'has been upgraded' in certweaver_approver_policy_helm.stdout or
    'has been installed' in certweaver_approver_policy_helm.stdout
  when:
    - certweaver_addons.approverPolicy.enabled | default(false) | bool
    - not ansible_check_mode
    - certweaver_chart_verified | default(false) | bool

- name: Apply bootstrap certificate request policies
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ certweaver_kubeconfig_path }}"
      - apply
      - -f
      - /etc/certweaver/kubernetes/approver-policy/bootstrap-policy.yaml
  register: certweaver_policy_apply
  changed_when: >-
    'created' in certweaver_policy_apply.stdout or
    'configured' in certweaver_policy_apply.stdout
  when: certweaver_addons.approverPolicy.enabled | default(false) | bool

- name: Create dedicated trust-manager namespace
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ certweaver_kubeconfig_path }}"
      - create
      - namespace
      - "{{ certweaver_addons.trustManager.dedicatedNamespace | default('cert-manager-trust') }}"
      - --dry-run=client
      - -o
      - yaml
  register: certweaver_trust_namespace
  changed_when: false
  when: certweaver_addons.trustManager.enabled | default(false) | bool

- name: Apply dedicated trust-manager namespace
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ certweaver_kubeconfig_path }}"
      - apply
      - -f
      - -
    stdin: "{{ certweaver_trust_namespace.stdout }}"
  register: certweaver_trust_namespace_apply
  changed_when: >-
    'created' in certweaver_trust_namespace_apply.stdout or
    'configured' in certweaver_trust_namespace_apply.stdout
  when: certweaver_addons.trustManager.enabled | default(false) | bool
- name: Acquire verified trust-manager chart
  ansible.builtin.include_role:
    name: verified_chart
  vars:
    certweaver_chart_key: "trustManager"
    certweaver_chart_name: "trust-manager"
    certweaver_chart_reference: "oci://quay.io/jetstack/charts/trust-manager"
    certweaver_chart_repository: ""
    certweaver_chart_version: "{{ certweaver_trust_manager_version }}"
    certweaver_chart_checksum: "{{ certweaver_chart_checksums.get('trustManager', '') }}"
  when: certweaver_addons.trustManager.enabled | default(false) | bool

- name: Install trust-manager
  ansible.builtin.command:
    argv:
      - "{{ certweaver_chart_helm_executable | default('/usr/local/bin/helm') }}"
      - upgrade
      - --install
      - trust-manager
      - "{{ certweaver_chart_archive_path }}"
      - --namespace
      - "{{ certweaver_addons.trustManager.dedicatedNamespace | default('cert-manager-trust') }}"
      - --values
      - /etc/certweaver/kubernetes/trust-manager/values.yaml
      - --set
      - "app.webhook.tls.approverPolicy.certManagerNamespace=cert-manager"
      - --set
      - "app.trust.namespace={{ certweaver_addons.trustManager.dedicatedNamespace | default('cert-manager-trust') }}"
      - --set
      - "secretTargets.enabled={{ certweaver_addons.trustManager.secretTargets | default(false) | bool | lower }}"
      - --wait
      - --timeout
      - 10m
  environment:
    KUBECONFIG: "{{ certweaver_kubeconfig_path }}"
  register: certweaver_trust_manager_helm
  changed_when: >-
    'has been upgraded' in certweaver_trust_manager_helm.stdout or
    'has been installed' in certweaver_trust_manager_helm.stdout
  when:
    - certweaver_addons.trustManager.enabled | default(false) | bool
    - not ansible_check_mode
    - certweaver_chart_verified | default(false) | bool

- name: Acquire verified cert-manager-csi-driver chart
  ansible.builtin.include_role:
    name: verified_chart
  vars:
    certweaver_chart_key: "csiDriver"
    certweaver_chart_name: "cert-manager-csi-driver"
    certweaver_chart_reference: "oci://quay.io/jetstack/charts/cert-manager-csi-driver"
    certweaver_chart_repository: ""
    certweaver_chart_version: "{{ certweaver_csi_driver_version }}"
    certweaver_chart_checksum: "{{ certweaver_chart_checksums.get('csiDriver', '') }}"
  when: certweaver_addons.csiDriver.enabled | default(false) | bool

- name: Install cert-manager CSI Driver
  ansible.builtin.command:
    argv:
      - "{{ certweaver_chart_helm_executable | default('/usr/local/bin/helm') }}"
      - upgrade
      - --install
      - cert-manager-csi-driver
      - "{{ certweaver_chart_archive_path }}"
      - --namespace
      - cert-manager
      - --values
      - /etc/certweaver/kubernetes/csi-driver/values.yaml
      - --wait
      - --timeout
      - 10m
  environment:
    KUBECONFIG: "{{ certweaver_kubeconfig_path }}"
  register: certweaver_csi_driver_helm
  changed_when: >-
    'has been upgraded' in certweaver_csi_driver_helm.stdout or
    'has been installed' in certweaver_csi_driver_helm.stdout
  when:
    - certweaver_addons.csiDriver.enabled | default(false) | bool
    - not ansible_check_mode
    - certweaver_chart_verified | default(false) | bool

- name: Acquire verified traefik chart
  ansible.builtin.include_role:
    name: verified_chart
  vars:
    certweaver_chart_key: "traefik"
    certweaver_chart_name: "traefik"
    certweaver_chart_reference: "traefik"
    certweaver_chart_repository: "https://traefik.github.io/charts"
    certweaver_chart_version: "{{ certweaver_addons.traefik.chartVersion | default('41.0.0') }}"
    certweaver_chart_checksum: "{{ certweaver_chart_checksums.get('traefik', '') }}"
  when: certweaver_addons.traefik.enabled | default(false) | bool

- name: Install Traefik without independent ACME resolver
  ansible.builtin.command:
    argv:
      - "{{ certweaver_chart_helm_executable | default('/usr/local/bin/helm') }}"
      - upgrade
      - --install
      - traefik
      - "{{ certweaver_chart_archive_path }}"
      - --namespace
      - traefik
      - --create-namespace
      - --values
      - /etc/certweaver/kubernetes/traefik/values.yaml
      - --set
      - "ports.web.nodePort={{ certweaver_ingress_http_nodeport }}"
      - --set
      - "ports.websecure.nodePort={{ certweaver_ingress_https_nodeport }}"
      - --wait
      - --timeout
      - 10m
  environment:
    KUBECONFIG: "{{ certweaver_kubeconfig_path }}"
  register: certweaver_traefik_helm
  changed_when: "'has been upgraded' in certweaver_traefik_helm.stdout or 'has been installed' in certweaver_traefik_helm.stdout"
  when:
    - certweaver_addons.traefik.enabled | default(false) | bool
    - not ansible_check_mode
    - certweaver_chart_verified | default(false) | bool

- name: Export administrative kubeconfig to a private controller destination
  ansible.builtin.include_tasks: _export_kubeconfig.yml
  when: certweaver_fetch_kubeconfig | bool

- name: Verify Prometheus Operator supports required alert rules
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ certweaver_kubeconfig_path }}"
      - get
      - crd
      - prometheusrules.monitoring.coreos.com
  changed_when: false
  when: certweaver_monitoring_prometheus_rules | bool

- name: Apply CertWeaver certificate alert rules
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ certweaver_kubeconfig_path }}"
      - apply
      - --server-side
      - --field-manager=certweaver
      - -f
      - /etc/certweaver/kubernetes/monitoring/prometheusrule.yaml
  register: certweaver_prometheus_rule_apply
  changed_when: >-
    'created' in certweaver_prometheus_rule_apply.stdout or
    'configured' in certweaver_prometheus_rule_apply.stdout
  when: certweaver_monitoring_prometheus_rules | bool

- name: Run cluster add-on smoke tests
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ certweaver_kubeconfig_path }}"
      - get
      - pods
      - --all-namespaces
  changed_when: false
