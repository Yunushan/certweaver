---
- name: Require explicit private credential export inputs
  ansible.builtin.assert:
    that:
      - certweaver_mode in ['rke2-ha', 'k3s-ha', 'existing-kubernetes']
      - certweaver_deployment_name is match('^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')
      - not (lookup('ansible.builtin.config', 'DEFAULT_DEBUG') | bool)
    fail_msg: Administrative kubeconfig export requires a named Kubernetes profile and disabled Ansible debug.

- name: Validate private controller destination before add-on changes
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/protect-kubeconfig"
      - check
      - "{{ certweaver_local_kubeconfig_path }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  changed_when: false
  check_mode: false
  no_log: true
