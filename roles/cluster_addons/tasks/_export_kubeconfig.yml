---
- name: Export administrative kubeconfig only through a private controller path
  when: not ansible_check_mode
  no_log: true
  diff: false
  block:
    - name: Prepare the private controller directory
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/protect-kubeconfig"
          - prepare
          - "{{ certweaver_local_kubeconfig_path }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: certweaver_kubeconfig_export_destination
      changed_when: (certweaver_kubeconfig_export_destination.stdout | from_json).changed

    - name: Inspect administrative source without following links
      ansible.builtin.stat:
        path: "{{ certweaver_kubeconfig_path }}"
        follow: false
        checksum_algorithm: sha256
        get_checksum: true
        get_mime: false
        get_attributes: false
      register: certweaver_kubeconfig_export_source

    - name: Require one protected bounded administrative source
      ansible.builtin.assert:
        that:
          - certweaver_kubeconfig_export_source.stat.isreg | default(false)
          - not (certweaver_kubeconfig_export_source.stat.islnk | default(false))
          - certweaver_kubeconfig_export_source.stat.uid == 0
          - certweaver_kubeconfig_export_source.stat.nlink == 1
          - certweaver_kubeconfig_export_source.stat.mode == '0600'
          - certweaver_kubeconfig_export_source.stat.size > 0
          - certweaver_kubeconfig_export_source.stat.size <= 1048576
          - certweaver_kubeconfig_export_source.stat.checksum is match('^[a-f0-9]{64}$')
        fail_msg: Export requires a root-owned mode-0600 regular kubeconfig of at most 1 MiB.

    - name: Read protected credential bytes for transfer
      ansible.builtin.slurp:
        src: "{{ certweaver_kubeconfig_path }}"
      register: certweaver_kubeconfig_export_blob

    - name: Bind transferred bytes to the inspected source
      ansible.builtin.assert:
        that:
          - certweaver_kubeconfig_export_blob.encoding == 'base64'
          - certweaver_kubeconfig_export_blob.content is string
          - certweaver_kubeconfig_export_blob.content | length <= 1398104
          - >-
            (certweaver_kubeconfig_export_blob.content | b64decode | hash('sha256')) ==
            certweaver_kubeconfig_export_source.stat.checksum
        fail_msg: Kubeconfig changed during transfer or exceeded the export bound.

    - name: Atomically publish the credential as a private controller file
      ansible.builtin.copy:
        content: "{{ certweaver_kubeconfig_export_blob.content | b64decode }}"
        dest: "{{ (certweaver_kubeconfig_export_destination.stdout | from_json).destination }}"
        mode: "0600"
        follow: false
        unsafe_writes: false
        backup: false
        force: true
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Verify final controller ownership permissions and source digest
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/protect-kubeconfig"
          - verify
          - "{{ certweaver_local_kubeconfig_path }}"
          - --sha256
          - "{{ certweaver_kubeconfig_export_source.stat.checksum }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      changed_when: false
  always:
    - name: Discard the registered credential value after transfer
      ansible.builtin.set_fact:
        certweaver_kubeconfig_export_blob: {}
        cacheable: false
