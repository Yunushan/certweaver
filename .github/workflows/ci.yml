name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: ruff check src tests
      - run: yamllint config examples inventories kubernetes playbooks roles .github .gitlab-ci.yml
      - run: ansible-lint playbooks roles
      - run: pytest --cov=certweaver --cov-report=term-missing
      - run: ./scripts/validate-all.sh
      - run: certweaver matrix
