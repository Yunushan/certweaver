name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: CI / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -c constraints/ci.txt -e '.[dev]'
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: ruff check src tests
      - run: python scripts/verify_supply_chain.py
      - run: yamllint config examples inventories kubernetes playbooks roles .github .gitlab-ci.yml
      - run: ansible-lint playbooks roles
      - run: pytest --cov=certweaver --cov-report=term-missing
      - run: pip-audit --strict
      - run: ./scripts/validate-all.sh
      - run: certweaver matrix
