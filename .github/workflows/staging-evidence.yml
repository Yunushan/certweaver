name: Staging Evidence

on:
  workflow_dispatch:
    inputs:
      config:
        description: Configuration file for the deployed staging profile
        required: true
        default: config/certweaver.example.yml
        type: string
      manual_evidence_dir:
        description: Protected runner path containing the redacted manual artifacts
        required: true
        default: /var/lib/certweaver/staging-evidence/manual
        type: string

permissions:
  contents: read

jobs:
  live-evidence:
    name: Staging / live evidence
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, certweaver-staging]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -c constraints/ci.txt -e .
      - run: python scripts/verify_supply_chain.py
      - run: >-
          certweaver evidence -c "${{ inputs.config }}"
          -o "$RUNNER_TEMP/certweaver-evidence"
      - run: >-
          bash "$RUNNER_TEMP/certweaver-evidence/live-checks.sh"
          "$RUNNER_TEMP/certweaver-evidence"
        env:
          CERTWEAVER_NODES: ${{ secrets.CERTWEAVER_NODES }}
          KUBECONFIG: /etc/rancher/rke2/rke2.yaml
      - name: Add operator-collected artifacts
        env:
          MANUAL_EVIDENCE_DIR: ${{ inputs.manual_evidence_dir }}
        run: |
          set -euo pipefail
          allowed_root="/var/lib/certweaver/staging-evidence"
          manual_dir="$(realpath -e -- "$MANUAL_EVIDENCE_DIR")"
          case "$manual_dir" in
            "$allowed_root"|"$allowed_root"/*) ;;
            *)
              echo "manual_evidence_dir must stay below $allowed_root" >&2
              exit 2
              ;;
          esac
          if [[ -n "$(find "$manual_dir" -type l -print -quit)" ]]; then
            echo "manual evidence must not contain symlinks" >&2
            exit 2
          fi
          cp -a --no-preserve=ownership "$manual_dir"/. "$RUNNER_TEMP/certweaver-evidence"/
      - run: >-
          certweaver evidence-verify -c "${{ inputs.config }}"
          -e "$RUNNER_TEMP/certweaver-evidence"
