name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -c constraints/ci.txt -e '.[dev]'
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: python scripts/verify_supply_chain.py
      - run: make lint
      - run: make test
      - run: pip-audit --strict --skip-editable
      - run: ./scripts/validate-all.sh
      - run: python -m build
      - run: python scripts/verify_release.py --tag "${GITHUB_REF_NAME}"
      - run: mkdir -p dist
      - run: >-
          git archive --format=tar.gz
          --prefix=certweaver-${GITHUB_REF_NAME}/
          -o dist/certweaver-${GITHUB_REF_NAME}.tar.gz HEAD
      - run: >-
          git archive --format=zip
          --prefix=certweaver-${GITHUB_REF_NAME}/
          -o dist/certweaver-${GITHUB_REF_NAME}.zip HEAD
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/certweaver-${{ github.ref_name }}.sbom.cdx.json
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: |
            dist/*
