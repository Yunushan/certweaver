name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  security:
    uses: ./.github/workflows/security.yml
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    permissions:
      contents: read
      security-events: write
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
  build:
    needs: [quality, security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python scripts/install-python-deps.py build --project
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release.py --tag "$RELEASE_TAG" --identity-only
      - run: python scripts/build-package.py --commit "$GITHUB_SHA"
      - run: python scripts/check-package-reproducibility.py --commit "$GITHUB_SHA"
      - run: python scripts/check-wheel.py dist/*.whl
      - run: mkdir -p dist
      - run: >-
          git archive --format=tar.gz
          --prefix=certweaver-${GITHUB_REF_NAME}/
          -o dist/certweaver-${GITHUB_REF_NAME}.tar.gz HEAD
      - run: >-
          git archive --format=zip
          --prefix=certweaver-${GITHUB_REF_NAME}/
          -o dist/certweaver-${GITHUB_REF_NAME}.zip HEAD
      - name: Qualify the candidate using the shared artifact pipeline
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/qualify-release.py dist --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-candidate
          path: |
            dist/*
            release-evidence/qualification.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .certweaver/release-handoff
          merge-multiple: true
          digest-mismatch: error
      - name: Verify artifact handoff and release identity
        working-directory: .certweaver/release-handoff
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python "$GITHUB_WORKSPACE/scripts/check-release.py" dist --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Verify retained qualification evidence and database freshness
        working-directory: .certweaver/release-handoff
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python "$GITHUB_WORKSPACE/scripts/release-evidence.py" dist --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            .certweaver/release-handoff/dist/*
            .certweaver/release-handoff/release-evidence/qualification.json
          create-storage-record: false
      - name: Verify provenance before publication
        working-directory: .certweaver/release-handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/* release-evidence/qualification.json; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          target_commitish: ${{ github.sha }}
          files: |
            .certweaver/release-handoff/dist/*
