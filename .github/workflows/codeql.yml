name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 2"
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v4
