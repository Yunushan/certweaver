apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: certweaver-platform-bootstrap
spec:
  allowed:
    commonName:
      value: "*"
    dnsNames:
      values:
        - "*.svc"
        - "*.svc.cluster.local"
    usages:
      - server auth
      - client auth
      - digital signature
      - key encipherment
  selector:
    issuerRef:
      name: "*"
      kind: Issuer
      group: cert-manager.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: certweaver-platform-certificate-requester
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    resourceNames: ["certweaver-platform-bootstrap"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: certweaver-platform-certificate-requester
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: certweaver-platform-certificate-requester
subjects:
  - kind: ServiceAccount
    name: trust-manager
    namespace: cert-manager-trust
