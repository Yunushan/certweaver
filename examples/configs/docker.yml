apiVersion: certweaver.io/v1alpha1
kind: CertWeaverDeployment
metadata:
  name: certweaver-container-pki
  labels:
    owner: platform-security
    location: primary-datacenter
spec:
  mode: docker
  environment: staging
  platform:
    os: rocky9
    nodes:
      - name: pki-container-01
        address: 10.20.40.21
        sshUser: rocky
  versions:
    rke2: v1.33.12+rke2r2
    k3s: v1.33.12+k3s1
    helm: v3.21.2
    certManager: v1.20.2
    approverPolicy: v0.26.0
    trustManager: v0.23.0
    csiDriver: v0.15.0
    traefikChart: 41.0.0
    helmChecksums:
      amd64: sha256:0a745198de24545d0055cd8414bc8d2ba10363ef5f5d38369ea1b399671cc083
      arm64: sha256:bbd559fc0547f1d96ccbc68fe4f1cb98f01808f36538139e669369066b781267
  secrets: {}
  addons: {}
  adapters:
    enabled:
      - step-ca
      - openbao-pki
      - ejbca-community
    acknowledge: []
    versions:
      step_ca: REPLACE_WITH_VERSION
      step_ca_chart: ''
      openbao_chart: ''
      openbao_image: REPLACE_WITH_IMAGE_TAG
      acme_sh_ref: ''
      certbot: ''
      ejbca_image: REPLACE_WITH_IMAGE_TAG
      lego: ''
      dogtag: ''
      freeipa: ''
      cfssl: ''
      dehydrated_ref: ''
      spire_chart: ''
      boulder_ref: ''
      caddy: ''
      traefik: ''
      lemur_ref: ''
      win_acme: ''
      posh_acme: ''
    checksums: {}
    options:
      traefik-acme:
        resolverEnabled: false
      step-ca:
        installMode: docker
        environmentFile: /etc/certweaver/secrets/step-ca.env
      openbao-pki:
        installMode: docker
      ejbca-community:
        externalDatabase: true
        environmentFile: /etc/certweaver/secrets/ejbca.env
    installMode: docker
    startServices: false
