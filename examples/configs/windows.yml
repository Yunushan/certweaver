apiVersion: certweaver.io/v1alpha1
kind: CertWeaverDeployment
metadata:
  name: certweaver-windows-acme
  labels:
    owner: platform-security
    location: primary-datacenter
spec:
  mode: windows
  environment: staging
  platform:
    os: windows-server
    nodes:
      - name: iis-01
        address: 10.20.50.11
        ansibleUser: Administrator
        connection: winrm
        winrmPort: 5986
        winrmTransport: ntlm
        winrmServerCertValidation: validate
  versions:
    rke2: v1.33.12+rke2r2
    k3s: v1.33.12+k3s1
    helm: v3.21.2
    certManager: v1.20.2
    approverPolicy: v0.26.0
    trustManager: v0.23.0
    csiDriver: v0.15.0
    traefikChart: 41.0.0
    helmChecksums:
      amd64: sha256:0a745198de24545d0055cd8414bc8d2ba10363ef5f5d38369ea1b399671cc083
      arm64: sha256:bbd559fc0547f1d96ccbc68fe4f1cb98f01808f36538139e669369066b781267
  secrets: {}
  addons: {}
  adapters:
    enabled:
      - win-acme
      - posh-acme
    acknowledge: []
    versions:
      step_ca: ''
      step_ca_chart: ''
      openbao_chart: ''
      openbao_image: ''
      acme_sh_ref: ''
      certbot: ''
      ejbca_image: ''
      lego: ''
      dogtag: ''
      freeipa: ''
      cfssl: ''
      dehydrated_ref: ''
      spire_chart: ''
      boulder_ref: ''
      caddy: ''
      traefik: ''
      lemur_ref: ''
      win_acme: REPLACE_WITH_VERSION
      posh_acme: REPLACE_WITH_VERSION
    checksums:
      win_acme: REPLACE_WITH_SHA256
    options:
      win-acme:
        downloadUrl: https://example.invalid/replace-with-reviewed-win-acme-release.zip
      posh-acme:
        repository: PSGallery
    installMode: windows
    startServices: false
