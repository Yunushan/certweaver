name: certweaver-pki
services:
  step-ca:
    profiles: [step-ca]
    image: ${STEP_CA_IMAGE_REPOSITORY:?set STEP_CA_IMAGE_REPOSITORY}@${STEP_CA_IMAGE_DIGEST:?set STEP_CA_IMAGE_DIGEST}
    restart: unless-stopped
    ports: ["9000:9000"]
    volumes:
      - step-ca-data:/home/step
    env_file: [./secrets/step-ca.env]

  openbao:
    profiles: [openbao]
    image: ${OPENBAO_IMAGE_REPOSITORY:?set OPENBAO_IMAGE_REPOSITORY}@${OPENBAO_IMAGE_DIGEST:?set OPENBAO_IMAGE_DIGEST}
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]
    volumes:
      - openbao-data:/openbao/data
      - ./openbao:/openbao/config:ro
    command: server -config=/openbao/config/openbao.hcl

  ejbca:
    profiles: [ejbca]
    image: ${EJBCA_IMAGE_REPOSITORY:?set EJBCA_IMAGE_REPOSITORY}@${EJBCA_IMAGE_DIGEST:?set EJBCA_IMAGE_DIGEST}
    restart: unless-stopped
    ports: ["8443:8443"]
    env_file: [./secrets/ejbca.env]
    volumes:
      - ejbca-data:/mnt/persistent

  caddy:
    profiles: [caddy]
    image: ${CADDY_IMAGE_REPOSITORY:?set CADDY_IMAGE_REPOSITORY}@${CADDY_IMAGE_DIGEST:?set CADDY_IMAGE_DIGEST}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  traefik:
    profiles: [traefik]
    image: ${TRAEFIK_IMAGE_REPOSITORY:?set TRAEFIK_IMAGE_REPOSITORY}@${TRAEFIK_IMAGE_DIGEST:?set TRAEFIK_IMAGE_DIGEST}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-data:/data

volumes:
  step-ca-data: {}
  openbao-data: {}
  ejbca-data: {}
  caddy-data: {}
  caddy-config: {}
  traefik-data: {}
