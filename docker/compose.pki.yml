name: certweaver-pki
services:
  step-ca:
    profiles: [step-ca]
    image: docker.io/smallstep/step-ca@${STEP_CA_IMAGE_DIGEST:?pin STEP_CA_IMAGE_DIGEST}
    restart: unless-stopped
    ports: ["9000:9000"]
    volumes:
      - step-ca-data:/home/step
    env_file: [./secrets/step-ca.env]

  openbao:
    profiles: [openbao]
    image: docker.io/openbao/openbao@${OPENBAO_IMAGE_DIGEST:?pin OPENBAO_IMAGE_DIGEST}
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]
    volumes:
      - openbao-data:/openbao/data
      - ./openbao:/openbao/config:ro
    command: server -config=/openbao/config/openbao.hcl

  ejbca:
    profiles: [ejbca]
    image: docker.io/keyfactor/ejbca-ce@${EJBCA_IMAGE_DIGEST:?pin EJBCA_IMAGE_DIGEST}
    restart: unless-stopped
    ports: ["8443:8443"]
    env_file: [./secrets/ejbca.env]
    volumes:
      - ejbca-data:/mnt/persistent

  caddy:
    profiles: [caddy]
    image: docker.io/library/caddy@${CADDY_IMAGE_DIGEST:?pin CADDY_IMAGE_DIGEST}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  traefik:
    profiles: [traefik]
    image: docker.io/library/traefik@${TRAEFIK_IMAGE_DIGEST:?pin TRAEFIK_IMAGE_DIGEST}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-data:/data

volumes:
  step-ca-data: {}
  openbao-data: {}
  ejbca-data: {}
  caddy-data: {}
  caddy-config: {}
  traefik-data: {}
